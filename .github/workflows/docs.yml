name: Deploy Zensical Docs to Posit Connect

on:
  push:
    branches:
      - main  # Runs automatically when changes hit main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies & build site
        run: |
          python -m pip install --upgrade pip
          pip install zensical rsconnect-python
          zensical build

      - name: Deploy static site to Posit Connect
        env:
          CONNECT_SERVER: ${{ secrets.CONNECT_SERVER }}
          CONNECT_API_KEY: ${{ secrets.CONNECT_API_KEY }}
        run: |
          rsconnect deploy html \
            --directory ./site \
            --title "Zensical Documentation"
            
